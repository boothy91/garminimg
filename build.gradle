plugins {
    id 'com.android.library'
}

android {
    namespace 'org.free.garminimg'
    compileSdk 36

    defaultConfig {
        minSdk 30
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.jakewharton.timber:timber:5.0.1'
}
